name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.75"
          components: rustfmt

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: true

      - name: Flutter clean
        run: |
          cd flutter
          flutter clean
          
      - name: Flutter pub get
        run: |
          cd flutter
          flutter pub get
          


      - name: Install flutter-rust-bridge codegen
        run: cargo install flutter_rust_bridge_codegen --version 1.80.1 --locked

      - name: Generate bridge (generated_bridge.dart)
        run: flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart

      - name: Build Windows Release EXE
        run: |
          cd flutter
          flutter build windows --release

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PdRemote-Windows-EXE
          path: flutter/build/windows/x64/runner/Release/*.exe